<section class="main-container-outer relative min-h-[100dvh] overflow-hidden">
  <!-- Fullscreen Background Video -->
  <video
    src="assets/videos/hero.mp4"
    playsinline
    autoplay
    muted
    loop
    oncanplay="this.play()"
    onloadedmetadata="this.muted = true"
    class="absolute left-0 top-0 z-0 h-full min-h-[100dvh] w-full object-cover"
  ></video>

  <!-- Even dimming over video (no lighter band at top) -->
  <div class="pointer-events-none absolute inset-0 z-10 bg-neutral-950/50"></div>

  <!-- Fade into page background (stone-200 #e7e5e4); opaque at bottom = seamless handoff to next section -->
  <div
    class="pointer-events-none absolute inset-0 z-[11]"
    style="
      background: linear-gradient(
        to top,
        #e7e5e4 0%,
        #e7e5e4 5%,
        rgba(231, 229, 228, 0.92) 15%,
        rgba(231, 229, 228, 0.55) 30%,
        rgba(231, 229, 228, 0) 70%,
        rgba(231, 229, 228, 0) 100%
      );
    "
  ></div>

  <!-- Scroll Indicator -->
  <div class="absolute inset-x-0 bottom-6 z-20 mx-auto w-fit animate-bounce">
    <mat-icon (click)="scrollDown()" svgIcon="down-arrow" class="h-6 w-6 cursor-pointer text-white/90 transition-colors hover:text-white"></mat-icon>
  </div>
  <div class="main-container">
    <!-- Content -->
    <div class="relative z-20 flex h-full flex-col items-center justify-center px-4 sm:px-6 lg:px-8">
      <div class="hero-content">
        <h1 class="hero-main-title mt-4">{{ 'MAIN.HERO.TITLE' | translate }}</h1>
        <p class="hero-main-subtitle">
          {{ 'MAIN.HERO.CONTENT_FIRST' | translate }}
          <span class="hidden sm:inline">
            {{ 'MAIN.HERO.CONTENT_SECOND' | translate }}
          </span>
        </p>
        <div class="hero-cta">
          <a [routerLink]="['/', languageService.currentLang, 'contact-us']" class="btn-primary btn-lg">{{ 'MAIN.HERO.QUOTE_BUTTON' | translate }}</a>
        </div>
      </div>
    </div>
  </div>
</section>
