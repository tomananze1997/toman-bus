<section>
  <!-- Fallback Plain Background -->
  <div class="absolute inset-0 -z-40 bg-[#e7e5e4]"></div>

  <!-- Main Left-to-Right Gradient - mobile (default) -->
  <div
    class="absolute inset-0 -z-20 block sm:hidden"
    style="background: linear-gradient(to right, #e7e5e4 60%, rgba(231, 229, 228, 0.7) 75%, rgba(231, 229, 228, 0.4) 80%, rgba(231, 229, 228, 0) 100%)"
  ></div>

  <!-- Main Left-to-Right Gradient - sm -->
  <div
    class="absolute inset-0 -z-20 hidden sm:block lg:hidden"
    style="background: linear-gradient(to right, #e7e5e4 60%, rgba(231, 229, 228, 0.6) 75%, rgba(231, 229, 228, 0.3) 80%, rgba(231, 229, 228, 0) 100%)"
  ></div>

  <!-- Main Left-to-Right Gradient - lg and up -->
  <div
    class="absolute inset-0 -z-20 hidden lg:block"
    style="background: linear-gradient(to right, #e7e5e4 50%, rgba(231, 229, 228, 0.6) 65%, rgba(231, 229, 228, 0.3) 80%, rgba(231, 229, 228, 0) 100%)"
  ></div>

  <!-- Top Vertical Fade on Right -->
  <div
    class="pointer-events-none absolute right-0 top-0 -z-10 h-1/2 w-1/2"
    style="background: linear-gradient(to bottom, #e7e5e4 0%, rgba(231, 229, 228, 0.7) 50%, rgba(231, 229, 228, 0.1) 80%, transparent 100%)"
  ></div>

  <!-- Bottom Vertical Fade on Right -->
  <div
    class="pointer-events-none absolute bottom-0 right-0 -z-10 h-1/2 w-1/2"
    style="background: linear-gradient(to top, #e7e5e4 0%, rgba(231, 229, 228, 0.7) 40%, rgba(231, 229, 228, 0.1) 70%, transparent 100%)"
  ></div>
</section>
